<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prediction History - Weather Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body data-page="history">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">Weather Forecast</a>
        <div>
            <a class="btn btn-outline-light me-2" href="/prediction">Predict</a>
            <a class="btn btn-outline-light me-2" href="/weather">Weather Data</a>
            <a class="btn btn-outline-light me-2" href="/agent"><i class="bi bi-robot me-1"></i>AI Agent</a>
            <a class="btn btn-outline-light me-2" href="/history">History</a>
            <a class="btn btn-outline-light me-2" href="/performance">Performance</a>
            <a class="btn btn-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title">Prediction History</h4>
            <table class="table table-striped" id="historyTable">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Temperature</th>
                    <th>Humidity</th>
                    <th>Pressure</th>
                    <th>Decision</th>
                    <th>Next Temp</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
