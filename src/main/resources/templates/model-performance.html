<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model Performance - Weather Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body data-page="performance">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">Weather Forecast</a>
        <div>
            <a class="btn btn-outline-light me-2" href="/prediction">Predict</a>
            <a class="btn btn-outline-light me-2" href="/weather">Weather Data</a>
            <a class="btn btn-outline-light me-2" href="/agent"><i class="bi bi-robot me-1"></i>AI Agent</a>
            <a class="btn btn-outline-light me-2" href="/history">History</a>
            <a class="btn btn-outline-light me-2" href="/performance">Performance</a>
            <a class="btn btn-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="card-title mb-0">Automated Background Scheduler</h4>
                <button type="button" class="btn btn-outline-primary btn-sm fw-bold" onclick="triggerManualRetrain()">
                    🔄 Retrain Models Now
                </button>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="p-3 bg-light rounded border">
                        <small class="text-muted text-uppercase fw-bold">Scheduler Status</small>
                        <div class="h5 fw-bold mb-0 text-success" id="schedStatus">Active</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-3 bg-light rounded border">
                        <small class="text-muted text-uppercase fw-bold">Last Retrained</small>
                        <div class="h6 fw-bold mb-0 text-dark" id="schedLastRun">N/A</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-3 bg-light rounded border">
                        <small class="text-muted text-uppercase fw-bold">Total Background Cycles</small>
                        <div class="h5 fw-bold mb-0 text-primary" id="schedTotalRuns">0</div>
                    </div>
                </div>
            </div>
            <p class="text-muted small mt-3 mb-0" id="schedMessage">Background scheduler active (Interval: Every 1 hour).</p>
        </div>
    </div>
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title">Model Performance Metrics</h4>
            <ul class="list-group" id="performanceMetrics"></ul>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title">Performance Charts</h4>
            <canvas id="performanceChart" height="220"></canvas>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
