<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Weather Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body data-page="dashboard">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard">Weather Forecast</a>
        <div>
            <a class="btn btn-outline-light me-2" href="/prediction">Predict</a>
            <a class="btn btn-outline-light me-2" href="/weather">Weather Data</a>
            <a class="btn btn-outline-light me-2" href="/agent"><i class="bi bi-robot me-1"></i>AI Agent</a>
            <a class="btn btn-outline-light me-2" href="/history">History</a>
            <a class="btn btn-outline-light me-2" href="/performance">Performance</a>
            <a class="btn btn-light" href="/logout">Logout</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Model Performance</h5>
                    <p class="card-text" id="performanceSummary">Loading performance metrics...</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Quick Actions</h5>
                    <p class="card-text">Upload historical weather data, make predictions, and view saved history.</p>
                    <a href="/weather" class="btn btn-primary me-2">Upload Data</a>
                    <a href="/prediction" class="btn btn-secondary">Predict Weather</a>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-4 g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Prediction Accuracy</h5>
                    <canvas id="accuracyChart" height="220"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Latest Weather Records</h5>
                    <ul class="list-group" id="weatherSummary"></ul>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
